<!DOCTYPE html>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="img/icons/icon-192.png">
<link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
<title>Korant Online</title>
<meta name="theme-color" content="#120d09">

<link rel="stylesheet" href="css/fonts.css">
<style>
  /* Tek, karanlık bir görünüm (oyun ekranı): tema değişse de aynı kalır.
     Düzen: 3D sahne arkada; üstte oyuncu kartı + kaynaklar, yanlarda yuvarlak kısayollar, altta ana menü;
     ekranlar ahşap çerçeveli parşömen pencerelerde açılır (yatayda sol sekme sütunu, dikeyde üst sekme şeridi). */
  :root { --gold:#e7c75a; --gold2:#a8862e; --bg:#120d09; --txt:#f2e8d2; --mut:#b9a888; --line:rgba(231,199,90,.35);
    --wood0:#1c110a; --wood1:#3a2415; --wood2:#5a381f; --wood3:#7a4f2c; --parch:#ecdcb4; --parch2:#dcc693; --ink:#3b2815; --ink2:#7a5f3c;
    --orange:#e58a2c; --red:#c2321e; --green:#3f9a4a; --blue:#3d6fb6; --display:Cinzel,Georgia,serif; color-scheme:dark; }
  /* Oyun yalnızca yatay oynanır. Mantıksal ekran boyutu (--lw × --lh) JS'te ölçülür (orient.js): telefon dik tutuluyorsa
     oyun kabı 90° döndürülür, böylece dikey düzen hiç görünmez. Güvenli alan değişkenleri de buna göre eşlenir. */
  :root { --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --lw:100vw; --lh:100vh; }
  #game { position:fixed; left:0; top:0; width:var(--lw); height:var(--lh); overflow:hidden; background:var(--bg); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--txt); font-family:Inter,system-ui,sans-serif; font-size:14px; user-select:none; touch-action:manipulation; }
  button { font:inherit; color:inherit; cursor:pointer; }
  #stage, #stage canvas { position:fixed; inset:0; display:block; }
  #overlay { position:fixed; inset:0; pointer-events:none; overflow:hidden; }

  /* ---------- Ana üs HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; padding:calc(var(--sat) + 8px) max(8px,var(--sar)) calc(var(--sab) + 8px) max(8px,var(--sal)); }
  #hud > * { pointer-events:auto; position:absolute; }
  .pcard { top:inherit; left:max(8px,var(--sal)); top:calc(var(--sat) + 8px); display:flex; align-items:center; gap:8px; padding:4px 14px 4px 4px; border-radius:30px; border:2px solid var(--wood0); background:linear-gradient(var(--wood2),var(--wood1)); box-shadow:0 3px 8px #0009, inset 0 1px 0 #fff2; }
  .ava { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:22px; background:radial-gradient(circle at 35% 30%,#fff3c4,#c99a35 70%); border:2px solid var(--wood0); }
  .pinfo { display:grid; gap:2px; text-align:left; min-width:86px; }
  .pinfo b { font-family:var(--display); color:var(--gold); font-size:13px; line-height:1; }
  .pinfo span { font-weight:800; font-size:13px; line-height:1; }
  .xpb { display:block; height:7px; border-radius:4px; background:#0009; overflow:hidden; border:1px solid #000; }
  .xpb > i { display:block; height:100%; background:linear-gradient(#ffe07a,#e58a2c); }
  .res { right:max(8px,var(--sar)); top:calc(var(--sat) + 8px); display:grid; gap:5px; justify-items:end; }
  .pill { display:flex; align-items:center; gap:6px; height:26px; padding:0 4px 0 2px; min-width:112px; border-radius:14px; background:linear-gradient(#2a1a10e6,#120b06e6); border:1px solid #6b4a2a; box-shadow:0 2px 5px #0008; font-variant-numeric:tabular-nums; }
  .pill > span { width:24px; text-align:center; font-size:15px; margin-left:-6px; filter:drop-shadow(0 1px 1px #000); }
  .pill b { flex:1; text-align:right; font-size:13px; }
  .pill small { color:var(--mut); font-size:10px; }
  .pill button { width:18px; height:18px; border-radius:50%; border:1px solid #1d4d22; background:linear-gradient(#7fe08a,#2f9a44); color:#06200c; font-weight:800; font-size:13px; line-height:1; padding:0; }
  .pill:not(:has(button)) { padding-right:10px; }
  .dbtn:active > i { transform:translateY(2px) scale(.97); }
  .badge { position:absolute; top:-3px; right:2px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:var(--red); border:1px solid #fff8; font-size:11px; font-weight:800; display:grid; place-items:center; }
  .dock { left:50%; bottom:calc(var(--sab) + 8px); transform:translateX(-50%); display:flex; gap:4px; padding:6px 10px 4px; border-radius:18px; background:linear-gradient(#2a1a10d9,#120b06d9); border:2px solid #6b4a2a; box-shadow:0 4px 14px #000a; }
  .dbtn { position:relative; display:grid; justify-items:center; gap:1px; background:none; border:0; padding:0; width:78px; }
  .dbtn > i { font-style:normal; width:56px; height:56px; border-radius:16px; display:grid; place-items:center; font-size:28px; background:linear-gradient(#f5dc85,#c99a35); border:2px solid var(--wood0); box-shadow:0 3px 0 #6b4f16, inset 0 2px 0 #fff6; }
  .dbtn > span { font-family:var(--display); font-size:11px; font-weight:900; color:#fff; text-shadow:0 1px 0 #000, 0 0 4px #000; white-space:nowrap; }
  .short .res { grid-auto-flow:column; } .short .pill { min-width:0; } .short .pill b { min-width:44px; } .short .dbtn > i { width:46px; height:46px; font-size:23px; }

  /* ---------- Pencereler ---------- */
  #win { position:fixed; inset:0; pointer-events:none; }
  #win > * { pointer-events:auto; }
  .scrim { position:absolute; inset:0; background:#000a; }
  .win.side .scrim, .win.bar .scrim { display:none; }
  .frame { position:absolute; display:flex; flex-direction:column; border-radius:16px; border:3px solid var(--wood0); background:linear-gradient(var(--wood2),var(--wood1)); box-shadow:0 12px 40px #000c, inset 0 2px 0 #fff2; padding:6px; animation:pop .2s ease-out; }
  .win.full .frame { left:50%; top:50%; transform:translate(-50%,-50%); width:min(940px,calc(var(--lw) * 0.96)); height:min(620px,calc(var(--lh) - 24px)); animation-name:popc; }
  .win.side .frame { right:max(10px,var(--sar)); top:calc(var(--sat) + 8px); bottom:calc(var(--sab) + 86px); width:min(calc(var(--lw) * 0.5),560px); }
  .win.bar .frame { left:50%; bottom:calc(var(--sab) + 10px); transform:translateX(-50%); width:min(660px,calc(var(--lw) * 0.96)); animation-name:none; }
  .frame > header { position:relative; display:flex; align-items:center; gap:8px; min-height:38px; padding:0 44px 6px 6px; }
  .frame h2 { margin:0; font-family:var(--display); font-weight:900; font-size:17px; color:#3a2206; padding:5px 22px; border-radius:8px; background:linear-gradient(#ffe69a,#e0a83c); border:2px solid var(--wood0); box-shadow:inset 0 2px 0 #fff8, 0 2px 0 #0006; white-space:nowrap; }
  .wres { margin-left:auto; display:flex; gap:10px; font-weight:800; font-size:12px; font-variant-numeric:tabular-nums; flex-wrap:wrap; justify-content:flex-end; }
  .x { position:absolute; top:-2px; right:0; width:36px; height:36px; border-radius:50%; border:2px solid var(--wood0); background:radial-gradient(circle at 35% 30%,#ffb36a,#d2561c); color:#fff; font-weight:900; font-size:16px; box-shadow:0 2px 0 #0008, inset 0 2px 0 #fff5; }
  .wbody { flex:1; min-height:0; display:flex; gap:6px; }
  .tabs { display:flex; flex-direction:column; gap:5px; width:132px; flex:none; overflow:auto; }
  .tabs button { display:flex; align-items:center; gap:7px; padding:9px 8px; border-radius:9px; border:2px solid var(--wood0); background:linear-gradient(var(--wood3),var(--wood2)); font-weight:800; font-size:12px; text-align:left; color:#f3dfb6; }
  .tabs button.on { background:linear-gradient(#ffe69a,#e0a83c); color:#3a2206; }
  .tabs button small { display:block; font-weight:600; font-size:10px; opacity:.8; }
  .page { flex:1; min-width:0; overflow:auto; border-radius:10px; border:2px solid var(--wood0); background:linear-gradient(var(--parch),var(--parch2)); color:var(--ink); padding:10px; box-shadow:inset 0 0 22px #7a5f3c66; }
  .win.side .tabs, .win.side .wbody { flex-direction:row; } .win.side .wbody { flex-direction:column; } .win.side .tabs { width:auto; } .win.side .tabs button { flex:1; justify-content:center; padding:7px 4px; }
  
  @keyframes pop { from { opacity:0; transform:scale(.94); } } @keyframes popc { from { opacity:0; transform:translate(-50%,-50%) scale(.94); } }

  /* parşömen içi ortak parçalar */
  .page h3 { margin:0 0 6px; font-family:var(--display); font-size:15px; color:#5a3310; }
  .page p { margin:4px 0; } .mut { color:var(--ink2); font-size:12px; }
  .btn { font-weight:800; color:#2a1d08; background:linear-gradient(#f5dc85,#c99a35); border:2px solid var(--wood0); border-radius:10px; padding:8px 14px; box-shadow:0 3px 0 #6b4f16; white-space:nowrap; }
  .btn:active { transform:translateY(2px); box-shadow:0 1px 0 #6b4f16; }
  .btn:disabled { filter:grayscale(1) brightness(.75); cursor:default; }
  .btn.red { background:linear-gradient(#ff8a5a,#c2321e); color:#fff; box-shadow:0 3px 0 #5e140a; }
  .btn.blue { background:linear-gradient(#7fa4d8,#3d5f96); color:#fff; box-shadow:0 3px 0 #1f3357; }
  .btn.green { background:linear-gradient(#8fe08a,#3f9a4a); color:#06200c; box-shadow:0 3px 0 #1d4d22; }
  .btn.sm { padding:5px 9px; font-size:12px; border-radius:8px; }
  .row { display:flex; align-items:center; gap:8px; padding:8px; border-radius:10px; background:#fff5; border:1px solid #b89a6a; margin-bottom:6px; }
  .row.dim { opacity:.55; } .row > .grow { flex:1; min-width:0; } .row b { color:#3a2206; }
  .row .tag { flex:none; min-width:46px; text-align:center; font-family:var(--display); font-weight:900; font-size:15px; color:#5a3310; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; } .chip { font-size:11px; font-weight:600; padding:2px 7px; border-radius:10px; background:#3b281522; border:1px solid #7a5f3c66; }
  .stars { color:#d98a12; letter-spacing:1px; text-shadow:0 1px 0 #fff8; white-space:nowrap; } .stars.off { color:#9a8a6a; }
  .pbar { height:10px; border-radius:6px; background:#3b281533; overflow:hidden; border:1px solid #7a5f3c88; } .pbar > i { display:block; height:100%; background:linear-gradient(#ffcf4a,#e58a2c); }
  .statline { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; } .statline > div { flex:1 1 90px; text-align:center; padding:6px; border-radius:9px; background:#3b281518; border:1px solid #7a5f3c55; } .statline small { display:block; color:var(--ink2); font-size:11px; } .statline b { font-size:15px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .card { display:grid; gap:5px; justify-items:center; text-align:center; padding:10px 8px; border-radius:12px; background:#fff6; border:2px solid #b89a6a; } .card .big { font-size:38px; line-height:1; } .card b { font-family:var(--display); color:#5a3310; }

  /* dünya haritası */
  .map { position:relative; width:100%; min-width:560px; aspect-ratio:1000/600; border-radius:8px; overflow:hidden; }
  .mapwrap { overflow:auto; height:100%; display:grid; align-items:center; } .page.nopad { padding:0; }
  .map svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .mnode { position:absolute; transform:translate(-50%,-50%); display:grid; justify-items:center; gap:1px; background:none; border:0; padding:4px 8px; }
  .mnode > i { font-style:normal; font-size:26px; filter:drop-shadow(0 2px 2px #000); }
  .mnode > b { font-family:var(--display); font-weight:900; font-size:14px; color:#fff; text-shadow:0 2px 0 #000, 0 0 6px #000, 0 0 3px #000; white-space:nowrap; }
  .mnode > span { font-size:11px; font-weight:800; padding:1px 8px; border-radius:10px; background:#000a; color:#ffd36a; white-space:nowrap; }
  .mnode.lock { filter:grayscale(.9) brightness(.8); } .mnode:active { transform:translate(-50%,-48%); }

  /* kahraman ekranı */
  .hbar { position:absolute; display:flex; align-items:center; gap:8px; left:max(10px,var(--sal)); bottom:calc(var(--sab) + 92px); width:calc(calc(var(--lw) * 0.5) - 30px); max-width:520px; justify-content:center; }
  .hbar > div { text-align:center; padding:5px 16px; border-radius:12px; background:linear-gradient(#2a1a10e6,#120b06e6); border:2px solid #6b4a2a; min-width:170px; }
  .hbar small { display:block; font-weight:800; font-size:11px; letter-spacing:1px; } .hbar b { font-family:var(--display); font-size:17px; display:block; } .hbar span { font-size:12px; color:var(--mut); }
  .arrow { width:36px; height:36px; border-radius:50%; border:2px solid var(--wood0); background:radial-gradient(circle at 35% 30%,#ffd98a,#c98a2a); color:#3a2206; font-weight:900; }
  .roster { position:absolute; left:0; right:0; bottom:0; display:flex; gap:6px; overflow-x:auto; padding:8px max(10px,var(--sar)) calc(var(--sab) + 8px) max(10px,var(--sal)); background:linear-gradient(#0000,#000c 35%); }
  .port { position:relative; flex:none; width:58px; height:66px; border-radius:10px; border:2px solid var(--rc,#888); background:linear-gradient(#3a2a1a,#150d07); display:grid; place-items:center; font-size:24px; padding:0 0 12px; }
  .port small { position:absolute; left:0; right:0; bottom:0; font-size:10px; font-weight:800; background:#000a; border-radius:0 0 8px 8px; padding:1px 0; color:#fff; }
  .port.sel { box-shadow:0 0 0 2px #fff, 0 0 12px var(--rc); } .port.team::after { content:'✔'; position:absolute; top:-5px; right:-5px; width:17px; height:17px; border-radius:50%; background:var(--green); font-size:10px; display:grid; place-items:center; border:1px solid #fff8; color:#fff; }
  
  .slots { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:8px; }
  .slot { display:grid; justify-items:center; gap:2px; padding:6px 2px; border-radius:10px; background:#3b281518; border:2px solid #7a5f3c66; font-size:11px; color:var(--ink); min-width:0; } .slot i { font-style:normal; font-size:22px; } .slot.sel { border-color:#d2561c; background:#fff7; } .slot b { font-size:11px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gname { font-weight:800; text-shadow:0 0 1px #000, 0 1px 0 #0006; -webkit-text-stroke:.3px #0008; }

  /* demirci */
  .forge { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:8px; height:100%; } .forge > div { overflow:auto; min-height:0; }
  
  .ibtn { display:flex; width:100%; align-items:center; gap:8px; text-align:left; padding:6px 8px; border-radius:9px; background:#fff5; border:2px solid #b89a6a; margin-bottom:5px; color:var(--ink); } .ibtn.sel { border-color:#d2561c; background:#fff9; } .ibtn i { font-style:normal; font-size:20px; } .ibtn small { display:block; color:var(--ink2); font-size:11px; }
  .anvil { text-align:center; padding:10px; border-radius:12px; background:#3b281514; border:2px solid #7a5f3c66; } .anvil .big { font-size:44px; }
  .anvil.ok { animation:glowok .9s; } .anvil.fail { animation:shake .4s; } @keyframes glowok { 30% { box-shadow:0 0 40px #ffd23a, inset 0 0 40px #ffd23a; background:#fff3b0; } } @keyframes shake { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
  .warn { color:#a3200f; font-weight:800; }

  /* ---------- Savaş arayüzü ---------- */
  #battleUI { position:fixed; inset:0; pointer-events:none; } #battleUI[hidden] { display:none; }
  #battleUI > * { position:absolute; pointer-events:auto; }
  #btitle { top:calc(var(--sat) + 8px); left:50%; transform:translateX(-50%); font-family:var(--display); font-weight:900; color:var(--gold); text-shadow:0 2px 2px #000; font-size:15px; padding:3px 18px; border-radius:14px; background:#000a; border:1px solid var(--line); white-space:nowrap; pointer-events:none; }
  #bctl { left:max(10px,var(--sal)); bottom:calc(var(--sab) + 12px); display:flex; gap:8px; }
  .rb { width:46px; height:46px; border-radius:50%; border:2px solid var(--wood0); background:radial-gradient(circle at 35% 30%,#ffd98a,#c98a2a); color:#3a2206; font-weight:900; font-size:13px; box-shadow:0 3px 6px #000a, inset 0 2px 0 #fff6; }
  .rb.on { background:radial-gradient(circle at 35% 30%,#b8ffb0,#2f9a44); }
  #skills { right:max(10px,var(--sar)); bottom:calc(var(--sab) + 10px); display:flex; gap:10px; align-items:flex-end; }
  .skill { position:relative; width:72px; display:grid; justify-items:center; align-content:start; gap:2px; background:none; border:0; padding:0; }
  .skill > span { width:60px; height:60px; border-radius:50%; display:grid; place-items:center; font-size:28px; background:radial-gradient(circle at 35% 28%,#5a4a8a,#1d1630 75%); border:3px solid #6b5530; box-shadow:0 3px 8px #000b, inset 0 2px 0 #fff3; }
  .skill.sel > span { border-color:var(--gold); box-shadow:0 0 16px #e7c75a, inset 0 2px 0 #fff3; }
  .skill > small { font-size:10px; line-height:1.1; font-weight:800; color:#fff; text-shadow:0 1px 0 #000, 0 0 4px #000; max-width:72px; height:22px; text-align:center; overflow:hidden; }
  .skill > em { position:absolute; top:0; left:6px; width:60px; height:60px; border-radius:50%; background:#000b; display:grid; place-items:center; font-style:normal; font-weight:900; font-size:24px; color:#fff; }
  #bwho { left:50%; transform:translateX(-50%); bottom:calc(var(--sab) + 96px); max-width:min(calc(var(--lw) * 0.92),560px); text-align:center; font-size:12px; padding:5px 12px; border-radius:12px; background:#000a; border:1px solid var(--line); pointer-events:none; } #bwho:empty { display:none; } #bwho b { color:var(--gold); } #bwho i { color:var(--mut); }
  .hud { position:absolute; left:0; top:0; display:flex; align-items:center; pointer-events:auto; transition:opacity .4s; }
  .hud .lv { font-style:normal; z-index:1; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:900; color:#3a2206; background:radial-gradient(circle at 35% 30%,#fff0a8,#d9a12a); border:2px solid #000; margin-right:-6px; }
  .hud.B .lv { background:radial-gradient(circle at 35% 30%,#ff9a8a,#c2321e); color:#fff; } .hud.boss .lv { width:30px; height:30px; font-size:13px; box-shadow:0 0 10px #ff3a2a; }
  .hud .bars { width:62px; } .hud.boss .bars { width:96px; }
  .hud .hp { height:9px; background:#000c; border:1px solid #000; border-radius:5px; overflow:hidden; } .hud .hp div { height:100%; background:linear-gradient(#7dff7a,#2a9a2a); transition:width .3s; } .hud.B .hp div { background:linear-gradient(#ff7a6a,#b3261a); }
  .hud .tm { height:4px; background:#000a; margin-top:1px; border-radius:2px; overflow:hidden; } .hud .tm div { height:100%; background:#5ab4ff; }
  .hud.active .hp { box-shadow:0 0 0 2px var(--gold); } .hud.targetable { cursor:pointer; animation:pulse 1s infinite; } @keyframes pulse { 50% { filter:drop-shadow(0 0 6px #ff4a3a); } }
  .float { position:absolute; left:0; top:0; font-family:var(--display); font-weight:900; font-size:22px; color:#fff; text-shadow:0 2px 0 #000, 0 0 6px #000; white-space:nowrap; } .float.crit { color:#ffd23a; font-size:28px; } .float.heal { color:#7dff8a; }
  .banner { position:absolute; top:22%; left:0; right:0; text-align:center; pointer-events:none; animation:bannerIn 1.5s ease-out forwards; }
  .banner b { display:inline-block; font-family:var(--display); font-size:30px; font-weight:900; color:#fff3c4; letter-spacing:2px; padding:6px 28px; background:linear-gradient(90deg,#0000,#000b 20%,#000b 80%,#0000); text-shadow:0 0 12px #ffb347, 0 2px 0 #000; }
  .banner.B b { color:#ffd0d0; text-shadow:0 0 12px #ff3a3a, 0 2px 0 #000; }
  .banner small { display:block; color:var(--gold); font-weight:800; letter-spacing:3px; text-transform:uppercase; font-size:12px; text-shadow:0 1px 2px #000; }
  @keyframes bannerIn { 0% { transform:translateX(-60%); opacity:0; } 15% { transform:translateX(0); opacity:1; } 80% { transform:translateX(0); opacity:1; } 100% { transform:translateX(30%); opacity:0; } }
  .flash { position:fixed; inset:0; background:radial-gradient(circle,#fff,#fff8 60%,#fff0); pointer-events:none; z-index:5; animation:flash .45s ease-out forwards; } @keyframes flash { from { opacity:.85; } to { opacity:0; } }

  /* ---------- Sonuç / bilgi penceresi, bildirim ---------- */
  #modal { position:fixed; inset:0; background:#000b; display:grid; place-items:center; padding:16px; z-index:10; } #modal[hidden] { display:none; }
  .box { width:min(460px,100%); max-height:calc(var(--lh) * 0.88); overflow:auto; border-radius:16px; border:3px solid var(--wood0); background:linear-gradient(var(--wood2),var(--wood1)); padding:8px; text-align:center; box-shadow:0 0 40px #000; animation:pop .25s ease-out; }

.zonerow { display:grid !important; grid-template-columns:repeat(4, minmax(0,1fr)); gap:4px; margin:0 0 6px !important; flex-wrap:nowrap; }
.zonerow button { display:flex; align-items:center; justify-content:center; gap:4px; min-width:0; padding:5px 4px !important; font-size:12px; white-space:nowrap; }
.zonerow button span { overflow:hidden; text-overflow:ellipsis; } .zonerow button .ri { flex:none; width:16px; height:16px; } .zonerow button[disabled] { opacity:.5; }
.zbg h3, .zbg > .mut, .zbg > p { text-shadow:0 1px 0 #fff8; }
@media (max-width:520px) { .zonerow button { font-size:10.5px; gap:2px; } .zonerow button .ri { display:none; } }
/* Envanter ızgarası (Çanta, Örs, Pazar): kare yuvalar, nadirlik çerçevesi, köşede artı ve kuşanılı işareti */
.ivg { display:grid; grid-template-columns:repeat(auto-fill, minmax(50px, 1fr)); gap:4px; padding:6px; border-radius:6px;
  background:linear-gradient(#2a1d12,#1a110a); box-shadow:inset 0 0 0 1px #000, inset 0 2px 8px #000a; }
.ivc { position:relative; display:grid; place-items:center; aspect-ratio:1; min-width:0; padding:0; border:1px solid #5a4028; border-radius:4px; cursor:pointer;
  background:radial-gradient(circle at 50% 40%, #3b2a1b, #1d140c 75%); box-shadow:inset 0 0 0 1px #0008; }
.ivc .ico { width:86%; height:86%; border-radius:3px; }
.ivc.nil { cursor:default; background:radial-gradient(circle at 50% 40%, #2c1f14, #170f09 75%); opacity:.75; }
.ivc:hover:not(.nil) { border-color:#c9a14a; } .ivc.sel { border-color:#ffd45a; box-shadow:0 0 0 2px #ffd45a, 0 0 10px 2px #ffb52e88; z-index:1; }
.ivc .ivq { position:absolute; right:2px; bottom:2px; width:14px; height:14px; border-radius:3px; background:#2f7a3a; color:#fff; font:900 9px/14px Inter,system-ui,sans-serif; font-style:normal; text-align:center; box-shadow:0 0 0 1px #000; }
.ivc small { position:absolute; left:0; right:0; bottom:-1px; font-size:8.5px; font-weight:800; color:#ffe2a8; text-shadow:0 1px 1px #000; text-align:center; pointer-events:none; }
.ivinfo { padding:8px; border-radius:6px; background:#fff6; border:1px solid #7a5f3c55; margin-bottom:6px; }
.ivinfo.nil { display:grid; place-items:center; min-height:70px; text-align:center; }
.ivhead { display:flex; gap:10px; align-items:center; } .ivhead .ico.lg, .ivhead .ico { width:56px; height:56px; }
.ivmeta { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; } .ivacts { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.ivbag { display:grid; grid-template-columns:minmax(200px, 38%) minmax(0,1fr); gap:10px; align-items:start; }
.ivside { position:sticky; top:0; } .ivmain { min-width:0; }
.ivtop { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; margin-bottom:5px; } .ivtop b { display:inline-flex; align-items:center; gap:4px; font-variant-numeric:tabular-nums; } .ivtop b.warn { color:#b02a1a; }
.ivf { flex-wrap:wrap; margin-bottom:6px !important; }
.ivpick .ivhint, .ivhint { margin:2px 0 4px; font-size:11.5px; }
.forge.up .ivg { max-height:calc(var(--lh) - 150px); overflow:auto; }
@media (max-width:620px) { .ivbag { grid-template-columns:1fr; } .ivside { position:static; } }
/* Dil düğmelerinde bayrak */
.flag { display:inline-block; width:22px; height:15px; margin-right:6px; vertical-align:-3px; border-radius:2px; overflow:hidden; box-shadow:0 0 0 1px #0006; flex:none; }
.flag svg { display:block; width:100%; height:100%; }
.ayopt.lg .flag { width:30px; height:20px; margin:0 0 3px; }
.aylang button { display:inline-flex; align-items:center; }
/* Destek: çizimler ve simgeler */
.dsk-hero { display:flex; gap:12px; align-items:center; padding:8px 10px; margin-bottom:8px; border-radius:8px; background:linear-gradient(100deg,#fff8,#fff3); border:1px solid #7a5f3c55; }
.dsk-hero .dsk-art { flex:none; width:96px; height:64px; } .dsk-hero p { margin:2px 0 6px; font-size:12px; }
.dsk-ci { flex:none; display:inline-grid; place-items:center; width:28px; height:28px; border-radius:50%; margin-right:6px; vertical-align:middle; color:#fff; box-shadow:inset 0 0 0 2px #0003; }
.dsk-ci svg { width:16px; height:16px; fill:currentColor; }
.dsk-ci.c-bug { background:#b83a2a; } .dsk-ci.c-account { background:#3d6fb6; } .dsk-ci.c-pay { background:#2e8a6a; } .dsk-ci.c-other { background:#8a6a3a; }
.dsk-cats .btn { display:inline-flex; align-items:center; } .dsk-cats .dsk-ci { width:22px; height:22px; margin-right:5px; } .dsk-cats .dsk-ci svg { width:13px; height:13px; }
.dsk-t { justify-content:flex-start !important; } .dsk-t .grow { flex:1; min-width:0; }
.dsk-thh { display:flex; align-items:center; gap:6px; margin:6px 0; } .dsk-thh h3 { margin:0; }
.dsk-m { display:flex; gap:8px; align-items:flex-start; margin:6px 0; padding:6px 8px; border-radius:8px; background:#fff5; }
.dsk-m.a { background:#e3eefc; border:1px solid #3d6fb655; } .dsk-mb { min-width:0; flex:1; }
.dsk-av { flex:none; display:grid; place-items:center; width:32px; height:32px; border-radius:50%; overflow:hidden; box-shadow:0 0 0 2px #0002; } .dsk-av img, .dsk-av .pt { width:100%; height:100%; object-fit:cover; }
.dsk-av.team { background:#3d6fb6; color:#fff; } .dsk-av.team svg { width:18px; height:18px; fill:currentColor; }
.dsk-empty { display:grid; justify-items:center; gap:4px; padding:12px; text-align:center; } .dsk-empty-art { width:120px; height:80px; }
/* Ferman: rulo parşömen */
.fer-scroll { margin:8px 0 10px; }
.fer-rod { height:12px; margin:0 -4px; border-radius:6px; background:linear-gradient(#7a4a22,#c8925a 45%,#5a3216); box-shadow:0 2px 3px #0006; position:relative; }
.fer-rod::before, .fer-rod::after { content:''; position:absolute; top:-3px; width:12px; height:18px; border-radius:4px; background:linear-gradient(#e0b35a,#8a5a1a); box-shadow:0 1px 2px #0008; } .fer-rod::before { left:-6px; } .fer-rod::after { right:-6px; }
.fer-sheet { position:relative; padding:10px 16px 12px; background:radial-gradient(ellipse at 50% 30%, #fbf1d6, #ecd8a6 70%, #dcc088); box-shadow:inset 0 0 22px #a8803e66, inset 0 0 0 1px #b08a5288; }
.fer-head { display:flex; align-items:center; justify-content:center; gap:10px; } .fer-head b { font:900 20px var(--display); letter-spacing:3px; color:var(--fc); text-transform:uppercase; }
.fer-sign { width:18px; height:18px; background:var(--sign) center / contain no-repeat; }
.fer-sub { margin:2px 0 6px; text-align:center; font-size:11px; color:#7a5f3c; }
.fer-sheet textarea { width:100%; box-sizing:border-box; resize:none; min-height:64px; padding:8px 10px; border:1px dashed #a8803e; border-radius:4px; background:#fff8e8aa; color:#3a2410; font:italic 600 15px/1.4 Georgia, 'Times New Roman', serif; }
.fer-sheet textarea:focus { outline:2px solid var(--fc); outline-offset:1px; }
.fer-foot { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; margin-top:6px; }
.fer-meta { display:flex; flex-wrap:wrap; gap:4px; } .fer-meta .chip.warn { background:#e0a83c55; } .fer-cnt { font-variant-numeric:tabular-nums; }
.fer-sig { display:grid; justify-items:end; line-height:1.1; } .fer-sig i { font:italic 700 15px Georgia, serif; color:#3a2410; } .fer-sig small { font-size:10px; color:#7a5f3c; letter-spacing:1px; text-transform:uppercase; }
.fer-seal { width:40px; height:40px; border-radius:50%; background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--fc) 70%, #fff), var(--fc) 55%, color-mix(in srgb, var(--fc) 60%, #000)); box-shadow:0 2px 4px #0007, inset 0 0 0 3px #0002; position:relative; }
.fer-seal::after { content:''; position:absolute; inset:9px; background:var(--sign) center / contain no-repeat; filter:brightness(0) invert(1) opacity(.85); }
.fer-sheet .mbtns { margin-top:8px; }
/* Diyar Haritası: bölge kartları */
.dm-sum { display:flex; align-items:center; gap:12px; padding:8px 12px; margin-bottom:8px; border-radius:8px; color:#fff; background:linear-gradient(100deg, var(--fc), color-mix(in srgb, var(--fc) 45%, #000)); box-shadow:inset 0 0 0 1px #0004; }
.dm-sum .mut { color:#ffffffcc; } .dm-big { font:900 30px var(--display); line-height:1; white-space:nowrap; } .dm-big b { font-size:38px; }

<style>
/* "kaplama" paketi: arayüz kabuğu. Dövme demir çerçeveler, yıpranmış deri sayfalar, kırık ve çentikli kenarlar.
   EN SON yüklenir (index.html'de son <link>): öteki paketlerin sınıflarını yeniden giydirir, yerleşimlerine dokunmaz.
   Kurallar:
   - Yalnızca yatay düzen; sıkı ekranlar kök sınıflarla (.short, .tiny) ayarlanır, yön ortam sorgusu yoktur.
   - Ucuz teknikler: border-image (dosyanın sonundaki KENAR bloğu, bir kez çizilen SVG), küçük parçalarda clip-path,

   - Taşan çocuğu (rozet, nokta) olan kaplara clip-path verilmez (kırpılır, dokunma alanı da daralır): onlarda border-image.

:root {

  --hud1:#23262cf2; --hud2:#0f1114f7; --hudl:var(--kp-i4);
  --ink:#2c1c0c; --ink2:#59411f; --parch:#ecdcb4; --parch2:#dcc896; --gold:#e7c75a; --gold2:var(--kp-acc2);
  /* hazır zeminler */
  --kp-bg-iron:linear-gradient(var(--kp-tod),var(--kp-tod)) padding-box, var(--kp-tex-iron) padding-box, linear-gradient(180deg,var(--kp-i3),var(--kp-i1) 48px,var(--kp-i1)) padding-box;
  --kp-bg-hud:linear-gradient(var(--kp-tod),var(--kp-tod)) padding-box, var(--kp-tex-iron) padding-box, linear-gradient(180deg,var(--hud1),var(--hud2)) padding-box;

  --kp-cut-r2:polygon(0 0,58% 0,calc(58% + 5px) 3px,calc(58% + 10px) 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
  --kp-cut-r3:polygon(7px 0,100% 0,100% 100%,81% 100%,calc(81% - 3px) calc(100% - 3px),calc(81% - 9px) 100%,0 100%,0 7px);
  --kp-cut-b:polygon(7px 0,63% 0,calc(63% + 3px) 2px,calc(63% + 7px) 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
  --kp-cut-b2:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,31% 100%,calc(31% - 3px) calc(100% - 2px),calc(31% - 7px) 100%,0 100%,0 7px);
}
/* Kragmir: isli, sıcak demir; kor vurgusu; koyu tabaklanmış deri */
html[data-faction="ocak"] {
  --kp-i0:#0a0504; --kp-i1:#180c09; --kp-i2:#291712; --kp-i3:#40261d; --kp-i4:#62402f; --kp-hi:#9a6a52;
  --kp-acc:#ff8a3a; --kp-acc2:#c2401a; --kp-accg:rgba(255,120,40,.55);
  --kp-on:#f8e6d0; --kp-on2:#d6b49b; --kp-title:#ffd09a;
  --kp-seam:#7a4a2e; --kp-seam2:rgba(92,40,16,.5); --kp-shade:rgba(70,24,6,.11);
  --plate1:#ffcf90; --plate2:#e46f2e; --kp-plate-ink:#2a0e03;
  --kp-ring-a:var(--kp-ring-a-o); --kp-ring-b:var(--kp-ring-b-o); --kp-ring-c:var(--kp-ring-c-o);
  --wood0:var(--kp-i0); --wood1:var(--kp-i1); --wood2:var(--kp-i2); --wood3:var(--kp-i3);
  --hud1:#291712f2; --hud2:#0e0605f7; --hudl:var(--kp-i4); --rail1:#62402f; --rail2:#180c09;
  --ink:#2a130b; --ink2:#59301c; --parch:#ead8b4; --parch2:#dbc398; --gold:#f2b65a; --gold2:var(--kp-acc2); --line:rgba(255,120,50,.5); --bg:#0d0605;
}
/* Elentha: aydınlık mavi çelik; gök vurgusu; açık ham deri */
html[data-faction="sancak"] {
  --kp-i0:#0a111b; --kp-i1:#18283c; --kp-i2:#263d59; --kp-i3:#37587d; --kp-i4:#466e9c; --kp-hi:#a6c6ea;
  --kp-acc:#9adbff; --kp-acc2:#2f7fd0; --kp-accg:rgba(120,200,255,.55);
  --kp-on:#f2f8ff; --kp-on2:#c3d4e8; --kp-title:#eaf5ff;
  --kp-seam:#7a6a50; --kp-seam2:rgba(70,56,30,.45); --kp-shade:rgba(40,40,30,.08);
  --plate1:#f4fbff; --plate2:#9bcaf0; --kp-plate-ink:#0b2038;
  --kp-ring-a:var(--kp-ring-a-s); --kp-ring-b:var(--kp-ring-b-s); --kp-ring-c:var(--kp-ring-c-s);
  --wood0:var(--kp-i0); --wood1:var(--kp-i1); --wood2:var(--kp-i2); --wood3:var(--kp-i3);
  --hud1:#263d59f0; --hud2:#0f1b2cf7; --hudl:var(--kp-i4); --rail1:#466e9c; --rail2:#18283c;
  --ink:#2a2118; --ink2:#54442c; --parch:#f8f1df; --parch2:#eadfc4; --gold:#f4d470; --gold2:var(--kp-acc2); --line:rgba(140,200,255,.6); --bg:#0d1420;
}
/* Günün evresi: şafak ve günbatımı sıcak, gece soğuk ve koyu; gece vurgu ışıması artar (fenerler yanar) */
html[data-tod="dawn"] { --kp-tod:rgba(255,176,120,.07); }
html[data-tod="dusk"] { --kp-tod:rgba(255,112,56,.09); }
html[data-tod="night"] { --kp-tod:rgba(24,40,120,.17); }
html[data-tod="night"][data-faction="ocak"] { --kp-accg:rgba(255,130,50,.75); }
html[data-tod="night"][data-faction="sancak"] { --kp-accg:rgba(140,210,255,.75); }
/* Düşük grafik: doku döşenmez */
html.gfx-low { --kp-tex-iron:none; --kp-tex-hide:none; }

/* ====================== 2. Pencere ve modal ====================== */
.scrim { background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,.62),rgba(0,0,0,.84)); }
#modal { background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,.66),rgba(0,0,0,.88)); }
.frame { border:10px solid transparent; border-radius:0; padding:0 1px 1px; box-shadow:none; border-image:var(--kp-ring-a) 18 / 18px / 8px round; background:var(--kp-bg-iron); }
.frame > header { min-height:40px; padding:0 48px 5px 3px; gap:6px; }
.frame h2, html[data-faction] .frame h2 { position:relative; border:0; border-radius:0; padding:6px 30px 6px 16px; font-size:17px; letter-spacing:.6px; color:var(--kp-title);
  background:linear-gradient(180deg,var(--kp-i4),var(--kp-i2) 62%,var(--kp-i1)); clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,7px 100%,0 calc(100% - 7px));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 0 var(--kp-acc), inset 3px 0 0 var(--kp-acc); text-shadow:0 1px 0 #000, 0 0 12px var(--kp-accg); }
.wres { gap:5px; font-size:12px; color:var(--kp-on); }
.wres > span { display:inline-flex; align-items:center; gap:3px; padding:3px 9px 3px 5px; background:rgba(0,0,0,.4); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -1px 0 var(--kp-i4); clip-path:var(--kp-cut-s); }
.short .frame h2 { font-size:16px; padding:6px 24px 6px 12px; letter-spacing:.3px; } .short .wres { gap:4px; } .short .wres > span { padding:3px 7px 3px 4px; }
.x { top:-3px; right:-1px; width:40px; height:40px; border:0; border-radius:0; font-size:17px; color:#fff; background:linear-gradient(180deg,#e2553a,#8f1d10); clip-path:var(--kp-cut-o);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.5), inset 0 4px 0 rgba(255,255,255,.28); text-shadow:0 1px 0 #000; }
.x:active { background:linear-gradient(180deg,#8f1d10,#c23a22); }
.x.bk { width:40px; height:40px; color:var(--kp-acc); background:linear-gradient(180deg,var(--kp-i4),var(--kp-i2)); }
.x.bk:active { background:linear-gradient(180deg,var(--kp-i2),var(--kp-i4)); }
.wbody { gap:5px; }
.tabs { gap:4px; width:136px; }
.tabs button, html[data-faction="sancak"] .tabs button:not(.on) { border:0; border-radius:0; min-height:42px; padding:6px 8px 6px 10px; color:var(--kp-on);
  background:linear-gradient(90deg,var(--kp-i3),var(--kp-i2) 72%,var(--kp-i1)); box-shadow:inset 3px 0 0 var(--kp-i4), inset 0 1px 0 rgba(255,255,255,.13), inset 0 -1px 0 rgba(0,0,0,.55);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%); }
.tabs button:nth-child(3n+2) { clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%); }
.tabs button:nth-child(3n) { clip-path:polygon(0 0,100% 0,100% 100%,36% 100%,calc(36% - 4px) calc(100% - 3px),calc(36% - 9px) 100%,0 100%); }
.tabs button small { opacity:1; color:var(--kp-on2); }
.tabs button.on, html[data-faction] .tabs button.on { color:var(--kp-plate-ink); background:linear-gradient(90deg,var(--plate1),var(--plate2)); box-shadow:inset 4px 0 0 var(--kp-acc2), inset 0 1px 0 rgba(255,255,255,.65), inset 0 -2px 0 rgba(0,0,0,.28); }
.tabs button.on small { color:var(--kp-plate-ink); opacity:.82; }
.tabs button:active { transform:translateX(1px); }
.tico { border:0; border-radius:0; clip-path:var(--kp-cut-s); background:linear-gradient(180deg,var(--kp-i1),var(--kp-i0)); box-shadow:inset 0 0 0 1px var(--kp-i4); }
.tico svg { fill:var(--kp-title); } .tabs button.on .tico { box-shadow:inset 0 0 0 1px var(--kp-acc2); }
.page { border-radius:0; border:1px solid var(--kp-i0); background:var(--kp-bg-hide); box-shadow:inset 0 0 0 1px rgba(255,255,255,.4), inset 0 0 26px rgba(70,35,10,.26); }
.box { border:10px solid transparent; border-radius:0; padding:0 1px 1px; box-shadow:none; border-image:var(--kp-ring-b) 18 / 18px / 8px round; background:var(--kp-bg-iron); }
.box h2, html[data-faction] .box:not(.lose) h2, .tcard h2 { border:0; border-radius:0; margin-top:1px; padding:5px 30px; letter-spacing:.8px; color:var(--kp-title);
  background:linear-gradient(180deg,var(--kp-i4),var(--kp-i2) 62%,var(--kp-i1)); clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 0 var(--kp-acc); text-shadow:0 1px 0 #000, 0 0 12px var(--kp-accg); }
.box.lose h2 { color:#ffd6cc; background:linear-gradient(180deg,#6a2a20,#2a0c08); box-shadow:inset 0 1px 0 rgba(255,255,255,.2), inset 0 -2px 0 #c2321e; text-shadow:0 1px 0 #000, 0 0 12px rgba(255,60,40,.6); }
.box .in, .tin { border-radius:0; border:1px solid var(--kp-i0); background:var(--kp-bg-hide); box-shadow:inset 0 0 0 1px rgba(255,255,255,.4), inset 0 0 22px rgba(70,35,10,.24); }
.short .box.wide, .short .box.kdbox, .short .box.rep, .short .box.menu, .short .box.rbox { padding:0 1px 1px; }
/* kısa ekranda kutular yüksekliğin tamamına yakınını kullanır (Diyarın Hâli 667x375'te kaydırmasız sığar) */
.short .box { max-height:calc(var(--lh) - 18px); } .short .box.wx .mbtns { margin-top:4px; }
/* Menü: "Kapat" ızgaranın boş gözüne oturur (ayrı satır açmaz); kutu iki boyutta da kaydırmasız sığar */
.box.menu .in .mbtns, .short .box.menu .in .mbtns { grid-column:auto; margin:0; align-items:stretch; } .box.menu .in .mbtns .btn { flex:1; }

/* ====================== 3. Düğmeler ======================
   Plaka ::before ile çizilir (kesim düğmenin kendisine değil plakaya uygulanır): böylece ::after ile dokunma alanı
   düğmenin dışına taşabilir (küçük düğmelerde en az 40px). Renk çifti --b1/--b2, alt kenar --b3, yazı --bt. */
.btn { --b1:#f3d98a; --b2:#c2933a; --b3:#6f5114; --bt:#241803; position:relative; z-index:0; min-height:40px; padding:8px 16px; border:0; border-radius:0; background:none; box-shadow:none; color:var(--bt); letter-spacing:.2px; }
.btn::before { content:''; position:absolute; inset:0; z-index:-1; clip-path:var(--kp-cut-b);
  background:linear-gradient(135deg,rgba(0,0,0,.55) 6px,rgba(0,0,0,0) 6.5px), linear-gradient(315deg,rgba(0,0,0,.55) 6px,rgba(0,0,0,0) 6.5px), linear-gradient(180deg,var(--b1),var(--b2));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.5), inset 0 -3px 0 var(--b3); }
.btn:nth-child(2n)::before { clip-path:var(--kp-cut-b2); }
.btn:active { transform:translateY(1px); box-shadow:none; }
.btn:active::before { background:linear-gradient(135deg,rgba(0,0,0,.55) 6px,rgba(0,0,0,0) 6.5px), linear-gradient(315deg,rgba(0,0,0,.55) 6px,rgba(0,0,0,0) 6.5px), linear-gradient(180deg,var(--b2),var(--b1)); box-shadow:inset 0 0 0 1px rgba(0,0,0,.55), inset 0 2px 0 rgba(0,0,0,.25), inset 0 -1px 0 var(--b3); }
.btn:disabled { --b1:#a39c8c; --b2:#7c7668; --b3:#4a463c; --bt:#221f19; filter:none; opacity:.8; }
.btn:disabled:active { transform:none; }
.btn.red { --b1:#cf3f27; --b2:#9a2013; --b3:#4d0d06; --bt:#fff; background:none; box-shadow:none; text-shadow:0 1px 0 rgba(0,0,0,.5); }
.btn.blue { --b1:#4b76b6; --b2:#2b4a80; --b3:#14254a; --bt:#fff; background:none; box-shadow:none; text-shadow:0 1px 0 rgba(0,0,0,.5); }
.btn.green { --b1:#8fdc88; --b2:#46a050; --b3:#1d4d22; --bt:#06200c; background:none; box-shadow:none; }
.btn.red:disabled, .btn.blue:disabled, .btn.green:disabled { --b1:#a39c8c; --b2:#7c7668; --b3:#4a463c; --bt:#221f19; text-shadow:none; }
.btn.sm { min-height:32px; min-width:40px; padding:5px 11px; border-radius:0; }
.btn.sm::after { content:''; position:absolute; inset:-4px 0; }
.btn.big { min-height:44px; padding:9px 30px; letter-spacing:.6px; }
.btn .ri { --ic:var(--bt); }
.btn .ri.rk svg.gi { stroke-width:22px; }
.mbtns { gap:8px; }

/* alt sekmeler (çip düğmeler) */
/* iki satıra sarınca satırların dokunma alanı (32 + 2×4) üst üste binmesin */
.sub { row-gap:8px; }
.sub button { position:relative; z-index:0; min-height:32px; padding:5px 13px; border:0; border-radius:0; background:none; color:var(--kp-on); }
.sub button::before { content:''; position:absolute; inset:0; z-index:-1; clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); background:linear-gradient(180deg,var(--kp-i3),var(--kp-i1)); box-shadow:inset 0 1px 0 rgba(255,255,255,.2), inset 0 -2px 0 var(--kp-i0); }
.sub button::after { content:''; position:absolute; inset:-4px 0; }
.sub button.on, html[data-faction] .sub button.on { background:none; color:var(--kp-plate-ink); }
html[data-faction="sancak"] .sub button:not(.on) { color:var(--kp-on); }
.sub button.on::before { background:linear-gradient(180deg,var(--plate1),var(--plate2)); box-shadow:inset 0 1px 0 rgba(255,255,255,.65), inset 0 -2px 0 var(--kp-acc2); }
.sub button:active { transform:translateY(1px); }
.sub button .ri:not(.rk) { --ic:var(--kp-on); } .sub button.on .ri:not(.rk) { --ic:var(--kp-plate-ink); }
.sub.kdtabs button.flw::before { background:linear-gradient(180deg,var(--kp-i2),var(--kp-i1)); box-shadow:inset 0 0 0 1px var(--kp-i4); }

/* ====================== 4. Sayfa içi parçalar ====================== */
.page h3, .box.wx h3, .pv-cols h3 { color:var(--ink); letter-spacing:.3px; }
.page > h3, .pside > h3, p.sec { gap:0 8px; margin-top:2px; } .page > h3 > .kp-hi, .pside > h3 > .kp-hi, p.sec > .kp-hi { margin-right:0; }
p.sec { color:var(--ink); }
.page > h3::before, .pside > h3::before, p.sec::before, .tree h4::before { width:11px; height:13px; margin:0 1px 0 0; transform:none; border:0; box-shadow:none; background:linear-gradient(180deg,var(--kp-i3),var(--kp-i1)); clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%); }
.page > h3::after, .pside > h3::after, p.sec::after { height:5px; border-radius:0; background:linear-gradient(90deg,var(--kp-i2) 0 16px,rgba(0,0,0,0) 16px 20px,var(--kp-seam) 20px,rgba(0,0,0,0) 96%) top / 100% 2px no-repeat, linear-gradient(90deg,rgba(0,0,0,0) 0 20px,var(--kp-seam2) 20px,rgba(0,0,0,0) 70%) bottom / 100% 1px no-repeat; }
/* başlık ikonu (ui-kaplama.js başlık sözcüğüne göre ekler): küçük demir plaka */
.kp-hi { flex:none; display:inline-grid; place-items:center; width:22px; height:22px; margin-right:6px; background:linear-gradient(180deg,var(--kp-i3),var(--kp-i1)); clip-path:var(--kp-cut-s); vertical-align:-5px; }
.kp-hi svg { width:72%; height:72%; fill:var(--kp-title); display:block; }
h3:has(> .kp-hi)::before, p.sec:has(> .kp-hi)::before, h4:has(> .kp-hi)::before { display:none; }
.frame h2 .kp-hi { width:20px; height:20px; margin:0 7px 0 -5px; background:none; clip-path:none; vertical-align:-4px; } .frame h2 .kp-hi svg { width:100%; height:100%; fill:var(--kp-acc); }
.mut { color:var(--ink2); }
.row { border-radius:0; border:1px solid var(--kp-seam2); padding-left:13px; background:var(--kp-bg-plate); box-shadow:inset 4px 0 0 var(--kp-i3), inset 0 1px 0 rgba(255,255,255,.8); clip-path:var(--kp-cut-r1); }
.row:nth-child(3n+2) { clip-path:var(--kp-cut-r2); } .row:nth-child(3n) { clip-path:var(--kp-cut-r3); }
.row.hit { border-color:#c2461c; box-shadow:inset 4px 0 0 #d2561c, inset 0 0 0 2px rgba(210,86,28,.45); }
.row b { color:var(--ink); }
.row .tag { color:var(--ink); }
.ibtn { min-height:44px; border-radius:0; border:1px solid var(--kp-seam2); padding-left:12px; background:var(--kp-bg-plate); box-shadow:inset 4px 0 0 var(--kp-i3), inset 0 1px 0 rgba(255,255,255,.8); clip-path:var(--kp-cut-r2); }
.ibtn:nth-child(3n+2) { clip-path:var(--kp-cut-r3); } .ibtn:nth-child(3n) { clip-path:var(--kp-cut-r1); }
.ibtn.sel { border-color:#c2461c; background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.55)); box-shadow:inset 4px 0 0 #d2561c, inset 0 0 0 1px rgba(210,86,28,.5); }
.ibtn:active { background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.2)); }
.ibtn small { color:var(--ink2); }
.card { border-radius:0; border:1px solid var(--kp-seam2); background:var(--kp-bg-plate); box-shadow:inset 0 1px 0 rgba(255,255,255,.8), inset 0 -3px 0 var(--kp-shade); clip-path:var(--kp-cut-m); }
.card b { color:var(--ink); }
.chip { border-radius:0; padding:2px 8px; border:0; background:rgba(50,26,6,.13); box-shadow:inset 0 0 0 1px var(--kp-seam2); clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px); }
.chip.up { color:#0f4a19; background:rgba(214,242,204,.8); box-shadow:inset 0 0 0 1px #1d6d2a; } .chip.down { color:#8a1608; background:rgba(255,224,214,.8); box-shadow:inset 0 0 0 1px #a3200f; }
/* ödül çipi: koyu demir etiket, parlak sayı, renkli ikon */
.chip.rw { padding:2px 9px 2px 4px; color:var(--kp-on); background:linear-gradient(180deg,var(--kp-i3),var(--kp-i1)); box-shadow:inset 0 0 0 1px var(--kp-i0), inset 0 1px 0 rgba(255,255,255,.16); font-variant-numeric:tabular-nums; }
.chip.rw .ri { --ic:#ffd77a; } .chip.rw.gn { padding-left:4px; color:#e9edf2; } .chip.rw.gn.g1 { color:#9fd0ff; } .chip.rw.gn.g2, .chip.rw.gn.g3 { color:#ffd77a; box-shadow:inset 0 0 0 1px #c8901c, inset 0 0 8px rgba(255,181,46,.35); text-shadow:none; }
.chip.rw.gn::before { content:none; }
.chip.cnt { background:linear-gradient(180deg,var(--kp-i3),var(--kp-i1)); color:var(--kp-on); box-shadow:inset 0 0 0 1px var(--kp-i0); }
.hint { border-radius:0; border:0; padding:7px 10px 7px 13px; background:var(--kp-shade); box-shadow:inset 4px 0 0 var(--kp-seam), inset 0 0 0 1px var(--kp-seam2); clip-path:var(--kp-cut-s); }
.statline > div, .kv > div { border-radius:0; border:0; color:var(--kp-on); background:linear-gradient(180deg,var(--kp-i2),var(--kp-i1)); box-shadow:inset 0 0 0 1px var(--kp-i0), inset 0 1px 0 1px rgba(255,255,255,.1), inset 0 -2px 0 var(--kp-i4); clip-path:var(--kp-cut-s); font-variant-numeric:tabular-nums; }
.statline small, .kv small { color:var(--kp-on2); } .statline b { color:var(--kp-on); }
.kv > div .ri, .statline .ri { --ic:var(--kp-acc); }
.kv .up, .statline .up { color:#8be693; } .kv .down, .statline .down { color:#ffa594; } .kv .mut, .statline .mut { color:var(--kp-on2); } .kv b, .statline b { color:inherit; }
.kv.cfk > div { background:linear-gradient(180deg,#1d3550,#11202f); box-shadow:inset 0 0 0 1px #0a1420, inset 0 -2px 0 #3a78b0; } .kv.cfk > .pen { background:linear-gradient(180deg,#4a1c14,#2a0e0a); box-shadow:inset 0 0 0 1px #1a0705, inset 0 -2px 0 #c2321e; }
.kv.cfk > .el.fire { box-shadow:inset 0 0 0 1px #0a1420, inset 0 -2px 0 #ff7a1a; } .kv.cfk > .el.ice { box-shadow:inset 0 0 0 1px #0a1420, inset 0 -2px 0 #4ab8e8; } .kv.cfk > .el.bolt { box-shadow:inset 0 0 0 1px #0a1420, inset 0 -2px 0 #d8b400; }
.kv > .ilvc { color:#ffe08a; background:linear-gradient(180deg,#4a3410,#261a06); box-shadow:inset 0 0 0 1px #171003, inset 0 -2px 0 #d9a12a; } .kv > .ilvc small { color:#e8cf9a; }
.pbar, .xpb { border-radius:0; background:rgba(30,14,4,.34); border:1px solid rgba(20,10,2,.7); transform:skewX(-18deg); }
.pbar > i, .xpb > i { background:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 9px,rgba(0,0,0,.25) 9px 10px), linear-gradient(180deg,#ffd97a,#e2682a); box-shadow:inset 0 1px 0 rgba(255,255,255,.5); }
.warbar { border-radius:0; border:1px solid var(--kp-i0); transform:skewX(-18deg); box-shadow:inset 0 1px 0 rgba(255,255,255,.3); }
.board > div, .board > button { border-radius:0; border:0; border-left:3px solid var(--kp-i3); background:rgba(255,255,255,.34); box-shadow:inset 0 -1px 0 var(--kp-seam2); }
.board > div:nth-child(even), .board > button:nth-child(even) { background:var(--kp-shade); }
.board .me, .board > div.me { border-left-color:#d2561c; background:linear-gradient(90deg,rgba(255,214,120,.75),rgba(255,255,255,.5)); }
.board > button { min-height:40px; }
.stars { color:#c97a06; }

/* ad kutuları soldan yazılır (dunya.css'teki tutar kutusu kuralı .box .crow içindeki her kutuyu sağa yaslıyordu) */

/* ====================== 5. Eşya kareleri: nadirlik ve artı ======================
   Kare üç katmandır: ::before kenar (nadirlik rengi), .ig dolgu (2px içeride, aynı kesim), ::after arkadaki hale.
   Nadirlik biçimle de ayrışır: Standart küçük pahlı kare · Nadir iki köşesi derin kesik, çift çerçeve, mavi hale ·
   Eşsiz taş kesimi (üstü ve altı sivri), altın çift çerçeve, geçen parıltı, atan hale.

.ico { --kp-sil:polygon(14% 0,100% 0,100% 86%,86% 100%,0 100%,0 14%); z-index:0; border:0; border-radius:0; background:none; box-shadow:none; }

.ico.rs { background:none; box-shadow:none; } .ico.rs::after { background:radial-gradient(circle at 50% 28%,#4a3420,#150d07 80%); }

.ico.it .ig { inset:2px; border-radius:0; clip-path:var(--kp-sil); background:radial-gradient(circle at 50% 26%,var(--g1),var(--g2) 82%); box-shadow:inset 0 2px 0 rgba(255,255,255,.22); }
.ico.it.g0 { --gc:#9aa3ad; }
.ico.it.g1 { --gc:#4aa8ff; --kp-sil:polygon(30% 0,100% 0,100% 70%,70% 100%,0 100%,0 30%); --kp-halo:rgba(61,155,255,.85); --kp-hs:6px; --kp-hw:1px; }
.ico.it.g1 .ig { box-shadow:inset 0 0 0 1.5px rgba(200,230,255,.55), inset 0 0 9px rgba(120,190,255,.5); }
.ico.it.g2, .ico.it.g3 { --gc:#ffc93a; --kp-sil:polygon(50% 0,84% 10%,100% 28%,100% 72%,84% 90%,50% 100%,16% 90%,0 72%,0 28%,16% 10%); --kp-halo:rgba(255,186,46,.95); --kp-hs:9px; --kp-hw:2px; }
.ico.it.g2::before, .ico.it.g3::before { background:linear-gradient(160deg,#fff3b0,#ffb52e 40%,#b86a00 70%,#ffd36a); }
.ico.it.g2 .ig, .ico.it.g3 .ig { box-shadow:inset 0 0 0 1.5px rgba(255,244,190,.8), inset 0 0 11px rgba(255,190,60,.7); }
.ico.it.g2 svg.gi, .ico.it.g3 svg.gi { width:66%; height:66%; }
/* hale: karenin arkasında yumuşak ışıma (küçük kutu gölgesi; kesik köşelerden de görünür) */
.ico.it::after { content:none; }
.ico.it.g1::after, .ico.it.g2::after, .ico.it.g3::after, .ico.it.p7::after, .ico.it.p9::after { content:''; position:absolute; inset:4px; z-index:-3; border-radius:0; opacity:.9; animation:none;
  background:var(--kp-halo); box-shadow:0 0 var(--kp-hs,6px) var(--kp-hw,1px) var(--kp-halo), 0 0 calc(var(--kp-hs,6px) + 2px) calc(var(--kp-hw,1px) + 3px) var(--kp-halo2,rgba(0,0,0,0)); }

.pv-msl { border:0; clip-path:var(--kp-cut-m); background:linear-gradient(180deg,var(--kp-i3),var(--kp-i1)); color:var(--kp-title); box-shadow:inset 0 0 0 1px var(--kp-i0), inset 0 -3px 0 var(--kp-i4); }
.pv-msl i { display:none; } .pv-msg.done .pv-msl { box-shadow:inset 0 0 0 1px var(--kp-i0), inset 0 -3px 0 #2f8a3e; }
.pv-msg.next .pv-msl { color:#2a1600; background:linear-gradient(180deg,#ffe69a,#dba63e); box-shadow:inset 0 0 0 2px #c2461c; }
.pv-mod { border-color:#6a4a9a; background:linear-gradient(180deg,rgba(239,230,255,.85),rgba(226,214,245,.55)); box-shadow:inset 4px 0 0 #6a4a9a, inset 0 1px 0 #fff; }
.pv-farm.on { box-shadow:inset 4px 0 0 #2f7a3a, inset 0 1px 0 #fff; }
.pv-bagn.full { box-shadow:inset 4px 0 0 #a3200f, inset 0 0 0 1px #a3200f; }
/* rapor */
.rside, .rcols > div { border:1px solid var(--kp-seam2); background:var(--kp-shade); clip-path:var(--kp-cut-s); }
.rl.rhd { border-radius:0; } .rbar::before, .rbar i { border-radius:0; }
.row.bk-on { box-shadow:inset 4px 0 0 #3f9b4b, inset 0 1px 0 #fff; }
/* Taş Yemini */
.sped { border-radius:0; background:linear-gradient(180deg,#8a8172,#5a5245); } .sfig { border-radius:0; } .crest { box-shadow:inset 0 0 0 4px var(--kp-acc), inset 0 0 0 6px var(--kp-i0); }
/* taraf rengi satır içi yazıldığında (style="color:#…") açık deride okunaklı kalsın */
.page [style*="color:#3d6fb6"], .box .in [style*="color:#3d6fb6"], .tin [style*="color:#3d6fb6"] { color:#1e4379 !important; }
.page [style*="color:#c2321e"], .box .in [style*="color:#c2321e"], .tin [style*="color:#c2321e"] { color:#861a08 !important; }
.race h3, .rcol h3, .faction b, .fbon em, .zown, .zc em { color:var(--fc); color:color-mix(in srgb,var(--fc) 70%,#000); }
/* koyu demir üstünde taraf rengi açılır (sohbet şeridi, sayı plakaları) */
#chatbar [style*="color:#3d6fb6"], .page .kv [style*="color:#3d6fb6"], .box .in .kv [style*="color:#3d6fb6"], .statline [style*="color:#3d6fb6"] { color:#9cc8ff !important; }
#chatbar [style*="color:#c2321e"], .page .kv [style*="color:#c2321e"], .box .in .kv [style*="color:#c2321e"], .statline [style*="color:#c2321e"] { color:#ff9c86 !important; }

/* dokunma hedefleri: ad bağlantıları, küçük çipler, kısa satırlar ve yazı kutuları 40 px'e tamamlanır.
   Kırpılmayan öğede taşan ::after; kendi taşmasını kırpan öğede (overflow:hidden) dolgu + eksi kenar boşluğu (yerleşim değişmez). */
.cn { position:relative; } .cn::after { content:''; position:absolute; inset:-12px 0; }
.chip.pv-more { position:relative; clip-path:none; } .chip.pv-more::after { content:''; position:absolute; inset:-12px -4px; }
.kl-link { padding:13px 0; margin:-13px 0; } .board > div:has(.kl-link) { min-height:40px; }
.fwho { padding:3px 0; margin:-3px 0; }
.chlist { gap:4px; } .kdb { gap:8px; } .short .kdh { min-height:40px; }
.page input[type=text], .box input[type=text] { min-height:40px; }

/* ====================== 9. Hareket ======================
   Kısa ve amaçlı: pencere açılışı, sekme değişimi, ödül belirişi, sayı sayımı (ui-kaplama.js), düğme basışı.
   Hepsi "az hareket" tercihinde ve düşük grafik kipinde kapanır (bölümün sonundaki kurallar). */
@keyframes kpWinC { from { opacity:0; transform:translate(-50%,-47.5%) scale(.965); } }
@keyframes kpPop { from { opacity:0; transform:translateY(10px) scale(.96); } }
@keyframes kpPage { from { opacity:0; transform:translateX(8px); } }
@keyframes kpLoot { from { opacity:0; transform:scale(.6); } 70% { transform:scale(1.08); } }
@keyframes kpBump { 30% { transform:scale(1.22); color:#fff6c4; } }
@keyframes kpPulse { 50% { transform:scale(1.18); } }
@keyframes kpBlink { 50% { opacity:.35; } }
@keyframes kpHalo { from { opacity:.62; } to { opacity:1; } }
@keyframes kpToast { from { transform:translateX(-50%) translateY(-8px); } }
@keyframes kpLoad { from { transform:scaleX(.25); opacity:.5; } to { transform:scaleX(1); opacity:1; } }
.frame { animation:kpPop .18s ease-out; } .win.full .frame { animation-name:kpWinC; }
.win.kp-tabbed .frame { animation:none; } .win.kp-tabbed .page { animation:kpPage .16s ease-out; }
.box, .tcard { animation:kpPop .2s ease-out; }
.btn, .tabs button, .sub button, .dbtn > i, .lbtn > i, .rb, .skill { transition:transform .07s ease-out; }
.loot > div { animation:kpLoot .32s ease-out backwards; }
.loot > div:nth-child(2) { animation-delay:.06s; } .loot > div:nth-child(3) { animation-delay:.12s; } .loot > div:nth-child(4) { animation-delay:.18s; } .loot > div:nth-child(5) { animation-delay:.24s; } .loot > div:nth-child(n+6) { animation-delay:.3s; }
#toast.on, #toast[style*="opacity: 1"] { animation:kpToast .22s ease-out; }
.ico.it.g2::after, .ico.it.g3::after, .ico.it.q9::after, .ico.it.q10::after { animation:kpHalo 2.4s ease-in-out infinite alternate; }
.ico.it.q10::after { animation-duration:1.3s; }
.icards .ico.it::after { animation:none; }
.ico.uq .ig::after { animation-duration:4.6s; }
@media (prefers-reduced-motion:reduce) {
  .frame, .win.full .frame, .win.kp-tabbed .page, .box, .tcard, .loot > div, #toast, .pill.kp-bump b, .krail .badge, .hud.targetable .hp, .hud.ally .hp, .ico.it::after, .ico.uq .ig::after, .prem.t0, .dbtn.shop > i, .kc.now, .tring, #loading::after { animation:none !important; }
  .btn, .tabs button, .sub button, .dbtn > i, .lbtn > i, .rb, .skill { transition:none !important; }
}
html.gfx-low .frame, html.gfx-low .win.kp-tabbed .page, html.gfx-low .box, html.gfx-low .tcard, html.gfx-low .loot > div, html.gfx-low #toast, html.gfx-low .pill.kp-bump b, html.gfx-low .krail .badge, html.gfx-low .hud.targetable .hp, html.gfx-low .hud.ally .hp,
html.gfx-low .ico.it::after, html.gfx-low .ico.uq .ig::after, html.gfx-low .prem.t0, html.gfx-low .kc.now, html.gfx-low .tring, html.gfx-low #loading::after { animation:none !important; }
html.gfx-low .btn, html.gfx-low .tabs button, html.gfx-low .sub button, html.gfx-low .dbtn > i, html.gfx-low .lbtn > i, html.gfx-low .rb, html.gfx-low .skill { transition:none !important; }
html.gfx-low .ico.uq .ig::after { display:none; }

    <div class="ld-foot"><div class="ld-txt">Oyun dosyaları yükleniyor</div><div class="ld-bar"><i></i><b>0%</b></div><div class="ld-err" hidden></div><button class="ld-retry" type="button" hidden>Tekrar yükle</button></div></div>
  </div>
  <script>
    // Açılış ekranı (Korant Online, 19 Kas): altın yükleme çubuğu yüzdeyle dolar; hata ya da 25 sn ilerlemesizlikte
    // "Tekrar yükle" düğmesi çıkar (önbelleği temizleyip sayfayı yeniler). main.js ilerlemeyi window.DDLoad.set ile bildirir.
    (function () {
      var el = function (q) { var L = document.getElementById('loading'); return L && L.querySelector(q); };
      var pct = 0, lastAt = Date.now();
      var retry = function () {
        var go = function () { location.reload(); };
        try { if (window.caches) caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }).then(go, go); else go(); } catch (e) { go(); }
      };
      var fail = function (msg) {
        var e = el('.ld-err'), r = el('.ld-retry'); if (!e) return;
        e.hidden = false; e.textContent = msg; r.hidden = false; r.onclick = retry;
        var L = document.getElementById('loading'); if (L) L.classList.add('stuck');
      };
      window.DDLoad = {
        set: function (p, text) {
          p = Math.max(pct, Math.min(100, Math.round(p))); if (p > pct) lastAt = Date.now(); pct = p;
          var i = el('.ld-bar i'), b = el('.ld-bar b'), t = el('.ld-txt');
          if (i) i.style.width = p + '%'; if (b) b.textContent = p + '%'; if (t && text) t.textContent = text;
        },
        fail: fail, retry: retry, get pct() { return pct; }
      };
      window.DDLoad.set(3);
      window.addEventListener('error', function (e) { if (document.getElementById('loading')) fail('Yükleme hatası: ' + (e.message || 'bilinmeyen hata') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
      window.addEventListener('unhandledrejection', function (e) { if (document.getElementById('loading')) fail('Yükleme hatası: ' + String(e.reason && e.reason.message || e.reason)); });
      var t = setInterval(function () {
        var L = document.getElementById('loading'); if (!L) return clearInterval(t);
        if (L.classList.contains('ready')) { lastAt = Date.now(); return; }
        if (Date.now() - lastAt > 25000) { clearInterval(t); fail('25 saniyedir ilerleme yok. Bağlantın yavaş olabilir ya da bir dosya yüklenemedi.'); }
      }, 2000);
    })();
  </script>
  <script>
    // Servis çalışanı (sw.js): ana ekrana eklenen oyun ağ yokken de açılsın. Yalnızca https ya da localhost'ta kaydedilir;
    // gömülü çerçevede (deneme linki) ve Android paketinde (Capacitor: dosyalar zaten cihazdadır) kaydedilmez.
    (function () {
      var sw = navigator.serviceWorker, top = false;
      try { top = window.top === window; } catch (e) { }
      if (!sw || !top || window.Capacitor || !(location.protocol === 'https:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))) return;
      var had = !!sw.controller;
      // Yeni sürüm var mı: her açılışta ve uygulamaya her dönüşte sorulur (tarayıcının kendi denetimi dakikalarca gecikebiliyor)
      var check = function () { sw.getRegistration().then(function (r) { if (r && r.active) return r.update(); }).catch(function () { }); };
      window.addEventListener('load', function () { sw.register('sw.js', { updateViaCache: 'none' }).then(check).catch(function () { }); });
      document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
      // Yeni sürüm devraldığında: açılış ekranındaysa hemen yenile; oyun açıksa dokununca yenileyen küçük bir düğme göster
      sw.addEventListener('controllerchange', function () {
        if (!had) { had = true; return; }
        if (document.getElementById('loading')) return location.reload();
        if (document.getElementById('swnew')) return;
        var b = document.createElement('button');
        b.id = 'swnew'; b.textContent = 'Yeni sürüm hazır · Yenile';
        b.style.cssText = 'position:fixed;left:50%;top:calc(var(--sat) + 6px);transform:translateX(-50%);z-index:15;padding:7px 16px;border-radius:14px;border:1px solid var(--line);background:#000d;color:#fff;font-weight:800';
        b.onclick = function () { location.reload(); };
        document.getElementById('game').appendChild(b);
      });
    })();
  </script>
